<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者画面 - 問い合わせ一覧</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            color: #4a3b32;
            background-color: #f7f4ee;
            margin: 0;
            padding: 24px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 1.8rem;
            color: #3d2e24;
            border-bottom: 2px solid #d4c5b3;
            padding-bottom: 12px;
        }

        /* パスワード入力エリア */
        .auth-card {
            background-color: #ffffff;
            border: 1px solid #e6ded5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(124, 92, 67, 0.05);
        }

        input[type="password"] {
            padding: 8px 12px;
            font-size: 1rem;
            border: 1px solid #d4c5b3;
            border-radius: 6px;
            outline: none;
        }

        button {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 16px;
            color: #ffffff;
            background-color: #7c5c43;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #634731;
        }

        /* 問い合わせテーブル */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(124, 92, 67, 0.05);
            margin-top: 16px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e6ded5;
        }

        th {
            background-color: #7c5c43;
            color: #ffffff;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #faf8f5;
        }

        .comment-cell {
            white-space: pre-wrap; /* 改行をそのまま表示 */
            word-break: break-all;
        }
    </style>
</head>

<body>

    <h1>管理者画面（問い合わせ確認）</h1>

    <div class="auth-card">
        <label for="pass">管理者パスワード：</label>
        <input type="password" id="pass" placeholder="パスワードを入力">
        <button onclick="fetchInquiries()">読み込む</button>
    </div>

    <div id="statusMessage"></div>

    <table id="inquiryTable" style="display: none;">
        <thead>
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 25%;">名前</th>
                <th style="width: 65%;">コメント</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        async function fetchInquiries() {
            const password = document.getElementById('pass').value;
            const statusMsg = document.getElementById('statusMessage');
            const table = document.getElementById('inquiryTable');
            const tbody = document.getElementById('tableBody');

            if (!password) {
                alert('パスワードを入力してください！');
                return;
            }

            statusMsg.textContent = 'データ取得中...';

            try {
                // RenderのAPIへリクエスト
                const response = await fetch('https://nezumika-kotodaman.onrender.com/api/admin/inquiries', {
                    headers: {
                        'x-admin-password': password
                    }
                });

                if (!response.ok) {
                    const err = await response.json();
                    statusMsg.textContent = '❌ ' + (err.error || '取得に失敗しました');
                    table.style.display = 'none';
                    return;
                }

                const data = await response.json();
                tbody.innerHTML = '';

                if (data.length === 0) {
                    statusMsg.textContent = '問い合わせはまだありません！';
                    table.style.display = 'none';
                    return;
                }

                // データをテーブルにセット
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.id}</td>
                        <td><strong>${escapeHtml(item.name || '匿名')}</strong></td>
                        <td class="comment-cell">${escapeHtml(item.comment || '')}</td>
                    `;
                    tbody.appendChild(tr);
                });

                statusMsg.textContent = `全 ${data.length} 件の問い合わせがあります。`;
                table.style.display = 'table';

            } catch (error) {
                console.error(error);
                statusMsg.textContent = '❌ 通信エラーが発生しました。';
            }
        }

        // HTMLエスケープ処理（安全のため）
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>

</body>

</html>
