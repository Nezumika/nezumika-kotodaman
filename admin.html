<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理ポータル - ことだまサイト</title>
  <style>
    /* 木目調テーマのベーススタイル */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #2b1d0c url('https://www.transparenttextures.com/patterns/wood-pattern.png');
      color: #3e2723;
      display: flex;
      min-height: 100vh;
    }

    /* サイドバー（メニュー） */
    .sidebar {
      width: 240px;
      background: rgba(44, 27, 14, 0.85);
      border-right: 2px solid #5d4037;
      padding: 20px 0;
      box-shadow: 4px 0 10px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .sidebar h2 {
      color: #d7ccc8;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .nav-item {
      padding: 15px 25px;
      color: #bcaaa4;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    .nav-item:hover, .nav-item.active {
      background: #4e342e;
      color: #fff8e1;
      border-left: 4px solid #8d6e63;
    }

    /* メインエリア */
    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    /* パスワード入力エリア＆カード */
    .wood-card {
      background: #fff8e1;
      border: 3px solid #8d6e63;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      margin-bottom: 25px;
    }

    .auth-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* フォームパーツ */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #5d4037;
    }

    input[type="password"],
    input[type="text"],
    input[type="date"] {
      padding: 10px 15px;
      border: 2px solid #a1887f;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      background: #fff;
      box-sizing: border-box;
      width: 100%;
      max-width: 400px;
    }

    button {
      background: #6d4c41;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      box-shadow: 0 3px 0 #3e2723;
    }

    button:hover {
      background: #5d4037;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3e2723;
    }

    /* テーブルデザイン（スマホ対応スクロール対応） */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      white-space: nowrap; /* テーブルセル内での意図しない崩れを防ぐ */
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #efebe9;
    }

    th {
      background: #8d6e63;
      color: #ffffff;
      font-weight: bold;
    }

    tr:hover {
      background-color: #f5f5f5;
    }

    .btn-hide {
      background: #e53935;
      font-size: 0.8rem;
      padding: 5px 10px;
    }

    .btn-hide:hover {
      background: #c62828;
    }

    /* ページ切り替え用 */
    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }

    /* バッジ */
    .badge-latest {
      background-color: #e67e22;
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }

    /* 📱 スマホ対応（レスポンシブスタイル） */
    @media (max-width: 768px) {
      body {
        flex-direction: column; /* 縦並びに変更 */
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid #5d4037;
        padding: 10px 0;
      }

      .sidebar h2 {
        margin-bottom: 10px;
        font-size: 1rem;
      }

      .sidebar-nav {
        display: flex;
        overflow-x: auto; /* メニューが多い場合に横スクロール */
      }

      .nav-item {
        padding: 10px 15px;
        font-size: 0.9rem;
        white-space: nowrap;
        border-left: none;
        border-bottom: 3px solid transparent;
      }

      .nav-item:hover, .nav-item.active {
        border-left: none;
        border-bottom: 3px solid #8d6e63;
      }

      .main-content {
        padding: 15px;
      }

      .wood-card {
        padding: 15px;
      }

      input[type="password"],
      input[type="text"],
      input[type="date"] {
        max-width: 100%; /* スマホでは全幅に */
      }
    }
  </style>
</head>
<body>

  <!-- サイドバー -->
  <div class="sidebar">
    <h2>📜 管理メニュー</h2>
    <div class="sidebar-nav">
      <div class="nav-item active" onclick="switchPage('inquiries-page', this)">
        💬 メイン問い合わせ
      </div>
      <div class="nav-item" onclick="switchPage('version-page', this)">
        🚀 DBバージョン管理
      </div>
      <div class="nav-item" onclick="switchPage('sub-inquiries-page', this)">
        ✉️ サブ問い合わせ（準備中）
      </div>
    </div>
  </div>

  <!-- メインコンテンツ領域 -->
  <div class="main-content">

    <!-- パスワード入力（共通） -->
    <div class="wood-card">
      <div class="auth-box">
        <label for="adminPass"><strong>🔑 管理者パスワード：</strong></label>
        <input type="password" id="adminPass" placeholder="パスワードを入力">
        <button onclick="handleLoadData()">データを読み込む</button>
      </div>
    </div>

    <!-- ページ1：メイン問い合わせ -->
    <div id="inquiries-page" class="page-section active">
      <div class="wood-card">
        <h3>💬 メイン問い合わせ一覧</h3>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>お名前</th>
                <th>コメント</th>
                <th>送信日時</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="inquiryTableBody">
              <tr>
                <td colspan="5" style="text-align: center; color: #8d6e63;">パスワードを入力して「データを読み込む」を押してください。</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ページ2：🚀 データベースバージョン管理（新機能！） -->
    <div id="version-page" class="page-section">
      <!-- バージョン追加・更新フォーム -->
      <div class="wood-card">
        <h3>🚀 新しいバージョンを登録</h3>
        <form id="versionForm" onsubmit="submitVersion(event)">
          <div class="form-group">
            <label for="newVersion">バージョン（version）：</label>
            <input type="text" id="newVersion" placeholder="例: 1.2.0" required>
          </div>
          <div class="form-group">
            <label for="releaseDate">リリース日（release_date）：</label>
            <input type="date" id="releaseDate" required>
          </div>
          <button type="submit">バージョンを更新・保存する</button>
        </form>
      </div>

      <!-- バージョン履歴一覧 -->
      <div class="wood-card">
        <h3>📜 バージョン履歴（versionsテーブル）</h3>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>バージョン</th>
                <th>リリース日</th>
              </tr>
            </thead>
            <tbody id="versionTableBody">
              <tr>
                <td colspan="3" style="text-align: center; color: #8d6e63;">パスワードを入力して「データを読み込む」を押してください。</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ページ3：将来追加する別の問い合わせ用エリア -->
    <div id="sub-inquiries-page" class="page-section">
      <div class="wood-card">
        <h3>✉️ サブ問い合わせ一覧</h3>
        <p>ここに新しい問い合わせフォームのデータを表示できるようになりますっ！</p>
      </div>
    </div>

  </div>

  <script>
    // 画面初期化（日付フォームの初期値を今日にする）
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      const releaseInput = document.getElementById('releaseDate');
      if (releaseInput) releaseInput.value = today;
    });

    // ページ切り替え処理
    function switchPage(pageId, element) {
      document.querySelectorAll('.page-section').forEach(page => page.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      
      document.getElementById(pageId).classList.add('active');
      element.classList.add('active');
    }

    // 「データを読み込む」ボタンを押したときのまとめてロード関数
    function handleLoadData() {
      loadInquiries();
      loadVersions();
    }

    // 1. 問い合わせデータ読み込み
    async function loadInquiries() {
      const password = document.getElementById('adminPass').value;
      if (!password) {
        alert('パスワードを入力してください！');
        return;
      }

      try {
        const response = await fetch('https://nezumika-kotodaman.onrender.com/api/admin/inquiries', {
          headers: { 'x-admin-password': password }
        });

        if (!response.ok) {
          alert('パスワードが違うか、通信エラーが発生しました！');
          return;
        }

        const data = await response.json();
        const tbody = document.getElementById('inquiryTableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">問い合わせはありません！</td></tr>';
          return;
        }

        data.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.id}</td>
            <td><strong>${escapeHtml(item.name)}</strong></td>
            <td>${escapeHtml(item.comment)}</td>
            <td>${new Date(item.date).toLocaleString('ja-JP')}</td>
            <td>
              <button class="btn-hide" onclick="hideInquiry(${item.id})">非表示</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

      } catch (error) {
        console.error(error);
      }
    }

    // 2. 🚀 バージョン履歴（versionsテーブル）データの取得
    async function loadVersions() {
      const password = document.getElementById('adminPass').value;
      if (!password) return;

      try {
        const response = await fetch('https://nezumika-kotodaman.onrender.com/api/admin/versions', {
          headers: { 'x-admin-password': password }
        });

        if (!response.ok) return;

        const data = await response.json();
        const tbody = document.getElementById('versionTableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">バージョン履歴がありません！</td></tr>';
          return;
        }

        data.forEach((item, index) => {
          const tr = document.createElement('tr');
          const isLatest = index === 0; // 一番上が最新の場合
          tr.innerHTML = `
            <td>${item.id}</td>
            <td><strong>${escapeHtml(item.version)}</strong>${isLatest ? '<span class="badge-latest">最新</span>' : ''}</td>
            <td>${item.release_date}</td>
          `;
          tbody.appendChild(tr);
        });

      } catch (error) {
        console.error(error);
      }
    }

    // 3. 🚀 新しいバージョンデータの送信登録
    async function submitVersion(event) {
      event.preventDefault();
      const password = document.getElementById('adminPass').value;
      if (!password) {
        alert('パスワードを入力してください！');
        return;
      }

      const version = document.getElementById('newVersion').value;
      const release_date = document.getElementById('releaseDate').value;

      try {
        const response = await fetch('https://nezumika-kotodaman.onrender.com/api/admin/versions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-password': password
          },
          body: JSON.stringify({ version, release_date })
        });

        if (response.ok) {
          alert('新しいバージョンを登録・更新しましたっ！');
          document.getElementById('newVersion').value = '';
          loadVersions(); // テーブルを自動更新
        } else {
          alert('更新処理に失敗しました。');
        }
      } catch (error) {
        console.error(error);
        alert('通信エラーが発生しました。');
      }
    }

    // 非表示処理
    async function hideInquiry(id) {
      if (!confirm(`ID: ${id} の問い合わせを非表示にしますか？`)) return;

      const password = document.getElementById('adminPass').value;

      try {
        const response = await fetch(`https://nezumika-kotodaman.onrender.com/api/admin/inquiries/${id}/hide`, {
          method: 'POST',
          headers: { 'x-admin-password': password }
        });

        if (response.ok) {
          alert('非表示にしました！');
          loadInquiries();
        } else {
          alert('非表示処理に失敗しました。');
        }
      } catch (error) {
        console.error(error);
        alert('通信エラーが発生しました。');
      }
    }

    // XSS対策のサニタイズ処理
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
