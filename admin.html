<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理ポータル - ことだまサイト</title>
  <style>
    /* 木目調テーマのベーススタイル */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #2b1d0c url('https://www.transparenttextures.com/patterns/wood-pattern.png'); /* 木目テクスチャ */
      color: #3e2723;
      display: flex;
      min-height: 100vh;
    }

    /* サイドバー（メニュー） */
    .sidebar {
      width: 240px;
      background: rgba(44, 27, 14, 0.85);
      border-right: 2px solid #5d4037;
      padding: 20px 0;
      box-shadow: 4px 0 10px rgba(0,0,0,0.3);
    }

    .sidebar h2 {
      color: #d7ccc8;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .nav-item {
      padding: 15px 25px;
      color: #bcaaa4;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
    }

    .nav-item:hover, .nav-item.active {
      background: #4e342e;
      color: #fff8e1;
      border-left: 4px solid #8d6e63;
    }

    /* メインエリア */
    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    /* パスワード入力エリア＆カード */
    .wood-card {
      background: #fff8e1;
      border: 3px solid #8d6e63;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      margin-bottom: 25px;
    }

    .auth-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="password"] {
      padding: 10px 15px;
      border: 2px solid #a1887f;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }

    button {
      background: #6d4c41;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      box-shadow: 0 3px 0 #3e2723;
    }

    button:hover {
      background: #5d4037;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3e2723;
    }

    /* テーブルデザイン */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #efebe9;
    }

    th {
      background: #8d6e63;
      color: #ffffff;
      font-weight: bold;
    }

    tr:hover {
      background-color: #f5f5f5;
    }

    .btn-hide {
      background: #e53935;
      font-size: 0.8rem;
      padding: 5px 10px;
    }

    .btn-hide:hover {
      background: #c62828;
    }

    /* ページ切り替え用 */
    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- サイドバー（将来別の画面が増えてもここに追加できます！） -->
  <div class="sidebar">
    <h2>📜 管理メニュー</h2>
    <div class="nav-item active" onclick="switchPage('inquiries-page', this)">
      💬 メイン問い合わせ
    </div>
    <div class="nav-item" onclick="switchPage('sub-inquiries-page', this)">
      ✉️ サブ問い合わせ（準備中）
    </div>
  </div>

  <!-- メインコンテンツ領域 -->
  <div class="main-content">

    <!-- パスワード入力（共通） -->
    <div class="wood-card">
      <div class="auth-box">
        <label for="adminPass"><strong>🔑 管理者パスワード：</strong></label>
        <input type="password" id="adminPass" placeholder="パスワードを入力">
        <button onclick="loadInquiries()">データを読み込む</button>
      </div>
    </div>

    <!-- ページ1：メイン問い合わせ -->
    <div id="inquiries-page" class="page-section active">
      <div class="wood-card">
        <h3>💬 メイン問い合わせ一覧</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>お名前</th>
              <th>コメント</th>
              <th>送信日時</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="inquiryTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #8d6e63;">パスワードを入力して「データを読み込む」を押してください。</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ページ2：将来追加する別の問い合わせ用エリア -->
    <div id="sub-inquiries-page" class="page-section">
      <div class="wood-card">
        <h3>✉️ サブ問い合わせ一覧</h3>
        <p>ここに新しい問い合わせフォームのデータを表示できるようになりますっ！</p>
      </div>
    </div>

  </div>

  <script>
    // ページ切り替え処理
    function switchPage(pageId, element) {
      document.querySelectorAll('.page-section').forEach(page => page.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
      
      document.getElementById(pageId).classList.add('active');
      element.classList.add('active');
    }

    // 問い合わせデータ読み込み
    async function loadInquiries() {
      const password = document.getElementById('adminPass').value;
      if (!password) {
        alert('パスワードを入力してください！');
        return;
      }

      try {
        const response = await fetch('https://nezumika-kotodaman.onrender.com/api/admin/inquiries', {
          headers: { 'x-admin-password': password }
        });

        if (!response.ok) {
          alert('パスワードが違うか、通信エラーが発生しました！');
          return;
        }

        const data = await response.json();
        const tbody = document.getElementById('inquiryTableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">問い合わせはありません！</td></tr>';
          return;
        }

        data.forEach(item => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${item.id}</td>
            <td><strong>${escapeHtml(item.name)}</strong></td>
            <td>${escapeHtml(item.comment)}</td>
            <td>${new Date(item.date).toLocaleString('ja-JP')}</td>
            <td>
              <button class="btn-hide" onclick="hideInquiry(${item.id})">非表示</button>
            </td>
          `;
          tbody.appendChild(tr);
        });

      } catch (error) {
        console.error(error);
        alert('通信に失敗しました。');
      }
    }

    // 非表示処理
    async function hideInquiry(id) {
      if (!confirm(`ID: ${id} の問い合わせを非表示にしますか？`)) return;

      const password = document.getElementById('adminPass').value;

      try {
        const response = await fetch(`https://nezumika-kotodaman.onrender.com/api/admin/inquiries/${id}/hide`, {
          method: 'POST',
          headers: { 'x-admin-password': password }
        });

        if (response.ok) {
          alert('非表示にしました！');
          loadInquiries(); // リロードして一覧を更新
        } else {
          alert('非表示処理に失敗しました。');
        }
      } catch (error) {
        console.error(error);
        alert('通信エラーが発生しました。');
      }
    }

    // XSS対策のサニタイズ処理
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
