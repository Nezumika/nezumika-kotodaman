<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未完成 - マイサイト</title>
  
  <!-- CSSの読み込み（共通） -->
  <link rel="stylesheet" href="headStyle.css">
  <link rel="stylesheet" href="style.css">
  
  <!-- このページ専用の追加スタイル -->
  <style>
    .not-found-card {
      text-align: center; /* 中身を中央揃えに */
    }
    
    .character-img {
      max-width: 100%; /* 横幅いっぱいまで */
      height: auto;
      border-radius: 8px; /* 角を少し丸く */
      border: 3px solid #8b5a2b; /* 木目のフチを付ける */
      box-shadow: 0 4px 8px rgba(0,0,0,0.3); /* 影を付ける */
      margin-bottom: 10px;
    }
    
    .character-caption {
      font-weight: bold;
      color: #5c4033;
      margin-bottom: 20px;
      display: block;
    }
  </style>
  
  <!-- 💡 JavaScriptでヘッダーを自動追加！ -->
  <script src="header.js" defer></script>
</head>
<body>

  <!-- 💡 ヘッダー挿入用 placeholder -->
  <div id="header-placeholder"></div>

  <!-- 💡 メインコンテンツ領域 -->
  <main class="page-container">
    
    <!-- 木目調カードデザインを適用 -->
    <div class="wood-card not-found-card">
      
      <!-- カードのタイトル部分 -->
      <div class="card-title">申し訳ありません！</div>
      
      <!-- カードの中身 -->
      <div class="card-content">
        <p class="word-text">
          まだ作ってないの！ごめんなさい！<br>
          完成までしばらくお待ちくださいっ！
        </p>

        <br>

        <!-- 画像エリア -->
        <img src="images/ooransye.jpg" alt="オーランシェ" class="character-img">
        <span class="character-caption">オーランシェかわいい</span>

      </div>
    </div>

    <!-- ボタンエリア（共通デザイン） -->
    <div class="button-group">
      <a href="index.html" class="wood-btn">トップへ戻る</a>
    </div>

  </main>

</body>
</html>
