<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>降臨攻略</title>

    <style>
        /* 1. 全体：生成り色と木肌のダークブラウン */
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            font-size: 16px;
            line-height: 1.7;
            color: #4a3b32;
            /* 木肌のようなダークブラウン */
            background-color: #f7f4ee;
            /* 温かい生成り色 */
            margin: 0;
            padding: 24px;
            max-width: 800px;
            /* 中央に寄せて読みやすく */
            margin-left: auto;
            margin-right: auto;
        }

        /* 2. タイトル */
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #3d2e24;
            margin-bottom: 1rem;
            letter-spacing: 0.03em;
            border-bottom: 2px solid #d4c5b3;
            /* 木の枝風の区切り線 */
            padding-bottom: 12px;
        }

        /* 3. 説明テキスト */
        .intro-text {
            background-color: #ffffff;
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid #e6ded5;
            margin-bottom: 32px;
            box-shadow: 0 2px 6px rgba(124, 92, 67, 0.04);
        }

        /* 4. 各攻略コンテンツのカード枠 */
        .quest-card {
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #e6ded5;
            padding: 20px;
            margin-bottom: 32px;
            box-shadow: 0 2px 8px rgba(124, 92, 67, 0.05);
        }

        .quest-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #7c5c43;
            /* メインウッドカラー */
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quest-title::before {
            content: "⚔️";
            /* クエストっぽいワンポイントアイコン */
        }

        /* 5. YouTube動画埋め込みエリア */
        .youtube {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            border-radius: 6px;
            overflow: hidden;
            /* 角丸を動画にも適用 */
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .youtube iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            border: none;
        }

        /* 6. トップへ戻るボタンエリア */
        .back-area {
            border-top: 1px dashed #d4c5b3;
            padding-top: 24px;
        }

        .btn-back {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 20px;
            color: #4a3b32;
            background-color: #e6ded5;
            /* 落ち着いたベージュ */
            border: 1px solid #c8bcad;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background-color: #d8cdbe;
            transform: translateY(-1px);
        }
    </style>

</head>

<body>

    <head>
        <meta charset="UTF-8">
        <title>マイサイト</title>

        <!-- CSSの読み込み -->
        <link rel="stylesheet" href="headStyle.css">
        <!-- 💡 JavaScriptでヘッダーを読み込む！ -->
        <script src="header.js"></script>
    </head>

    <body>

        <!-- 💡 ここに自動でメニューが挿入されます！ -->
        <div id="header-placeholder"></div>


    </body>

    <h1>降臨攻略</h1>

    <div class="intro-text">
        <p>各降臨クエストの攻略情報・動画まとめです！（順次更新予定）</p>
    </div>

    <!-- 降臨クエストごとのカード -->
    <div class="quest-card">
        <h2 class="quest-title">ムオン</h2>

        <div class="youtube">
            <iframe src="https://www.youtube.com/embed/R3WI-fMPDbE" title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- トップへ戻る -->
    <div class="back-area">
        <a href="index.html">
            <button type="button" class="btn-back">← トップへ戻る</button>
        </a>
    </div>

</body>

</html>
